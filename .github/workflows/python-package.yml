# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Every Friday at 8:00 AM EDT (12:00 UTC)
    - cron: '0 12 * * 5'


jobs:
  build:

    name: build (${{ matrix.python-version }}${{ matrix.osl && ', OSL' || '' }})
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    env:
      OSL_ROOT: ${{ matrix.osl_root }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13", "3.14"]
        include:
          # Installing OSL is slow, so only one job compiles OSL. The other
          # jobs still diff the generated OSL against the references.
          # Fedora packages OSL, which provides oslc; Ubuntu doesn't.
          # Setting OSL_ROOT makes the tests fail if oslc is missing.
          - python-version: "3.13"
            osl: true
            container: fedora:43
            osl_root: /usr

    steps:
    - name: Install OSL
      if: matrix.osl
      run: dnf install -y --setopt=install_weak_deps=False git tar gzip unzip openshadinglanguage openshadinglanguage-common-headers
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ matrix.python-version }}
        activate-environment: true
    - name: Install Python dependencies
      run: |
        uv pip install flake8 pytest MaterialX==1.39.5
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - uses: robinraju/release-downloader@v1.10
      with:
        repository: microsoft/DirectXShaderCompiler
        extract: true
        tag: v1.8.2407
        fileName: linux_dxc_2024_07_31.x86_64.tar.gz
        out-file-path: '.dxc'
    - uses: robinraju/release-downloader@v1.10
      with:
        repository: KhronosGroup/glslang
        extract: true
        tag: main-tot
        fileName: glslang-main-linux-x86_64-release.tar.gz
        out-file-path: '.glslang'
    - name: Configure the environment for tests
      run: |
        chmod +x .dxc/bin/* .glslang/bin/*
        echo "$GITHUB_WORKSPACE/.dxc/bin" >> $GITHUB_PATH
        echo "$GITHUB_WORKSPACE/.glslang/bin" >> $GITHUB_PATH
        echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/.dxc/lib" >> $GITHUB_ENV
        echo "METASHADE_PYTEST_OUT_DIR=$GITHUB_WORKSPACE/tests/out" >> $GITHUB_ENV
    - name: Print tool versions
      run: |
        dxc --version
        glslang --version
    - name: Print OSL version
      if: matrix.osl
      run: |
        oslc --help | head -n 1
        rpm -ql openshadinglanguage-common-headers | grep stdosl.h
    - name: Test with pytest
      run: |
        pytest -rs
